server {
    listen 80;
    root /usr/share/nginx/html;

    # Server-Sent Events: stream through immediately and keep the connection open.
    location = /api/events {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        # Overwrite (don't append): a client-supplied X-Forwarded-For must not reach the backend,
        # which trusts this header for rate limiting.
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Client-side routing: unknown paths serve the SPA.
    location / {
        try_files $uri /index.html;
    }
}
