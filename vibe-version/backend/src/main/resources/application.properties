quarkus.rest.path=/api
quarkus.http.port=8080
# Let auth failures on public endpoints fall through instead of rejecting the request outright.
quarkus.http.auth.proactive=false

# The Vite dev server proxies /api, but allow direct calls from it too.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:5173

# MongoDB: dev/test use Dev Services (a single-node replica set, so transactions work).
%prod.quarkus.mongodb.connection-string=${MONGODB_URI}
quarkus.mongodb.database=${MONGODB_DATABASE:sisu_vibe}
quarkus.mongodb.devservices.image-name=mongo:7.0

# JWT: Bearer token in the Authorization header. Dev mode generates a throwaway key pair;
# prod reads PEM files whose paths come from the environment.
mp.jwt.verify.issuer=sisu-vibe
smallrye.jwt.new-token.issuer=sisu-vibe
%prod.mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY}
%prod.smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY}

sisu.starting-balance=1000
sisu.token-ttl-hours=12
# Usernames listed here get the ADMIN role on registration (may resolve any prediction).
sisu.admins=${SISU_ADMINS:admin}

quarkus.swagger-ui.always-include=true
quarkus.log.category."fi.sisu.vibe".level=INFO

# Behind the nginx proxy, take the client IP from X-Forwarded-For (used by the login rate limit).
%prod.quarkus.http.proxy.proxy-address-forwarding=true
%prod.quarkus.http.proxy.allow-x-forwarded=true
