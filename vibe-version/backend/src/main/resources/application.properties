quarkus.http.port=8080

# --- HTTP hardening ---
# No legitimate request comes close; rejects oversized bodies before they are read into memory.
quarkus.http.limits.max-body-size=64K
# Behind nginx, take the client address from X-Forwarded-For, but only when the request comes from a
# trusted proxy address (nginx overwrites the header, see frontend/nginx.conf). Used for rate limiting.
quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.proxy.allow-x-forwarded=true
quarkus.http.proxy.trusted-proxies=127.0.0.1,::1,172.16.0.0/12,10.0.0.0/8,192.168.0.0/16
# Never send stack traces or exception details to clients.
quarkus.http.unhandled-error-content-type-default=json

# --- MongoDB ---
# In dev/test, Quarkus Dev Services starts a throwaway MongoDB container automatically.
# In prod (Docker Compose) the URI comes from the environment.
quarkus.mongodb.database=sisu_market
%prod.quarkus.mongodb.connection-string=${MONGODB_URI:mongodb://localhost:27017}

# --- JWT ---
# The bundled keypair is for local development only. Override both locations in any real deployment.
mp.jwt.verify.issuer=sisu-market
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION:publicKey.pem}
smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION:privateKey.pem}
sisu.jwt.ttl-hours=24

# --- Passwords & login protection ---
# bcrypt work factor (each +1 doubles the time). 12 is ~0.25 s per hash on a laptop. Old hashes with a lower
# cost are upgraded on the user's next login.
sisu.bcrypt-cost=12
# Tests create hundreds of users; a low cost keeps them fast and doesn't change what is tested.
%test.sisu.bcrypt-cost=4
# Failed logins allowed within the window: per account+IP, per IP, per account (that one over 4x the window).
sisu.rate-limit.login.per-account-ip=5
sisu.rate-limit.login.per-ip=20
sisu.rate-limit.login.per-account=50
sisu.rate-limit.login.window=15M
# New accounts per client IP.
sisu.rate-limit.register.per-ip=10
sisu.rate-limit.register.window=1H
# The whole test suite registers from 127.0.0.1; RegistrationLimitTest checks this limit with its own profile.
%test.sisu.rate-limit.register.per-ip=100000

# --- Roles ---
# Comma-separated usernames (case-insensitive) allowed to resolve any prediction.
sisu.admin-usernames=${SISU_ADMIN_USERNAMES:}
%test.sisu.admin-usernames=sisu_admin

# --- Domain ---
sisu.starting-balance=1000
sisu.seed-demo-data=true

# --- CORS (only needed when the frontend is served from another origin, e.g. Vite without its proxy) ---
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:5173}

quarkus.log.category."fi.sisu".level=INFO

# --- Pricing (constant-product market maker, see fi.sisu.market.pricing.Cpmm) ---
# Depth of every prediction's pool (yes * no = liquidity^2). Higher = prices move less per Sisu wagered.
sisu.market.liquidity=1000

# How often OPEN predictions past their closing time are flipped to CLOSED (wagering is refused
# from the exact closing instant regardless; this only updates the stored status and live clients).
sisu.close-check-interval=5s
