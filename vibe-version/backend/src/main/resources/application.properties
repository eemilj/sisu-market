quarkus.http.port=8080

# --- MongoDB ---
# In dev/test, Quarkus Dev Services starts a throwaway MongoDB container automatically.
# In prod (Docker Compose) the URI comes from the environment.
quarkus.mongodb.database=sisu_market
%prod.quarkus.mongodb.connection-string=${MONGODB_URI:mongodb://localhost:27017}

# --- JWT ---
# The bundled keypair is for local development only. Override both locations in any real deployment.
mp.jwt.verify.issuer=sisu-market
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION:publicKey.pem}
smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION:privateKey.pem}
sisu.jwt.ttl-hours=24

# --- Domain ---
sisu.starting-balance=1000
sisu.seed-demo-data=true

# --- CORS (only needed when the frontend is served from another origin, e.g. Vite without its proxy) ---
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:5173}

quarkus.log.category."fi.sisu".level=INFO
