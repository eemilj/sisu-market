# ---------------------------------------------------------------------------------------------
# HTTP
# ---------------------------------------------------------------------------------------------
# Every REST resource and the SSE stream live under /api (contracts/openapi.yaml `servers`).
quarkus.rest.path=/api
# Authentication is checked lazily so an expired/invalid cookie on a public endpoint (browsing is
# public, Constitution V) does not fail the request, and so auth failures reach our exception
# mappers and come back in the `Error` shape.
quarkus.http.auth.proactive=false

# ---------------------------------------------------------------------------------------------
# MongoDB (T008)
# ---------------------------------------------------------------------------------------------
# Multi-document transactions (data-model.md "Cross-entity invariants") need a replica set, so
# the production URI must point at one (docker-compose runs a single-node replica set `rs0`).
# In dev/test no URI is set and Quarkus Dev Services starts a Testcontainers MongoDB, which is
# itself a single-node replica set.
%prod.quarkus.mongodb.connection-string=${MONGODB_URI}
quarkus.mongodb.database=${MONGODB_DATABASE:sisu}
quarkus.mongodb.devservices.image-name=mongo:7.0
# Transactions require majority write concern and a primary read preference.
quarkus.mongodb.write-concern.w=majority
quarkus.mongodb.write-concern.journal=true
quarkus.mongodb.read-preference=primary

# ---------------------------------------------------------------------------------------------
# Session / JWT (T015, research.md section 3)
# ---------------------------------------------------------------------------------------------
mp.jwt.verify.issuer=https://sisu.market
smallrye.jwt.new-token.issuer=https://sisu.market
# The JWT travels only in the httpOnly session cookie, never an Authorization header.
mp.jwt.token.header=Cookie
mp.jwt.token.cookie=sisu_session
# Keys are never committed (Constitution V). In dev/test Quarkus generates a throwaway key pair;
# in prod they come from the environment (PEM file paths).
%prod.mp.jwt.verify.publickey.location=${SISU_JWT_PUBLIC_KEY_LOCATION}
%prod.smallrye.jwt.sign.key.location=${SISU_JWT_PRIVATE_KEY_LOCATION}
sisu.session.ttl=PT24H
# Browsers treat http://localhost as a secure context, so Secure cookies still work locally.
sisu.session.cookie-secure=true

# ---------------------------------------------------------------------------------------------
# OpenAPI (T018) - generated from annotated resources; must match contracts/openapi.yaml
# ---------------------------------------------------------------------------------------------
quarkus.smallrye-openapi.info-title=Sisu Market API
quarkus.smallrye-openapi.info-version=0.1.0
quarkus.smallrye-openapi.info-description=REST surface for the Sisu Prediction Market. \
  Authentication is via the httpOnly `sisu_session` cookie.
quarkus.smallrye-openapi.security-scheme=api-key
quarkus.smallrye-openapi.security-scheme-name=sessionCookie
quarkus.smallrye-openapi.api-key-parameter-in=cookie
quarkus.smallrye-openapi.api-key-parameter-name=sisu_session
quarkus.smallrye-openapi.security-scheme-description=httpOnly, Secure, SameSite=Strict JWT cookie
quarkus.smallrye-openapi.auto-add-security-requirement=true

quarkus.swagger-ui.always-include=true

# ---------------------------------------------------------------------------------------------
# Test coverage: merge @QuarkusTest coverage into the file the jacoco-maven-plugin reports on
# ---------------------------------------------------------------------------------------------
%test.quarkus.jacoco.data-file=jacoco.exec
%test.quarkus.jacoco.reuse-data-file=true
%test.quarkus.jacoco.report=false
